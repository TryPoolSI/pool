appId: dev.pool.prototype
---
- launchApp:
    clearState: true
    clearKeychain: true
# The signed-out front door (src/app/index.tsx).
- extendedWaitUntil:
    visible: Share the driving
    timeout: 60000
- openLink: pool:///sign-up
- tapOn:
    text: "^Open$"
    optional: true
# The hosted simulator can take over a minute to deliver an approved link.
- extendedWaitUntil:
    visible: Create your Pool account
    timeout: 120000
- assertVisible: Email address
- assertVisible: Password
- assertVisible: I am at least 18 years old.
- takeScreenshot: pool-ios-signup
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Share the driving
    timeout: 60000
- openLink: pool:///sign-in
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: Sign in to Pool
    timeout: 120000
